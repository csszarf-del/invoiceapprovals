<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SkyHi">
<meta name="theme-color" content="#faf9f5">
<title>SkyHi Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-display:'Space Grotesk','Inter',-apple-system,sans-serif;
  --bg:#faf9f5;--bg2:#f0eee6;--card:#ffffff;
  --text:#0b1220;--text2:#4a5265;--muted:#8b8f9c;
  --hairline:rgba(11,18,32,0.10);--hairline2:rgba(11,18,32,0.06);
  --fill:rgba(11,18,32,0.05);--fill2:rgba(11,18,32,0.035);
  --accent:#1d4ed8;--accent-press:#1a43b8;--accent-soft:#e7edfd;
  --green:#16a34a;--green-press:#128040;--green-soft:#e6f6ec;
  --red:#e11d48;--red-soft:#fdeaef;
  --amber:#d97706;--amber-soft:#fbeedb;--orange:#ea580c;--orange-soft:#fdeade;
  --gray-soft:rgba(11,18,32,0.10);
  --r-lg:18px;--r-md:14px;--r-sm:11px;
  --shadow:0 1px 2px rgba(11,18,32,0.05),0 8px 24px rgba(11,18,32,0.06);
  --shadow-sm:0 1px 2px rgba(11,18,32,0.05);
  --grad-blue:linear-gradient(180deg,#2456e0 0%,#1d4ed8 100%);
  --grad-green:linear-gradient(180deg,#1bb254 0%,#16a34a 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow-x:hidden;overscroll-behavior-y:contain}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);max-width:100vw;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
.header{background:rgba(250,249,245,0.82);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:14px 20px;display:flex;align-items:center;border-bottom:0.5px solid var(--hairline);position:sticky;top:0;z-index:10}
.header h1{font-family:var(--font-display);font-size:21px;font-weight:700;flex:1;letter-spacing:-0.02em;color:var(--text)}
.badge{background:var(--red);color:#fff;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;margin-right:8px;min-width:24px;text-align:center;font-family:var(--font-display)}
.header-refresh{background:none;border:none;font-size:19px;cursor:pointer;padding:6px 8px;color:var(--accent);border-radius:10px;transition:background .15s}
.header-refresh:active{background:var(--fill)}
.header-refresh.spinning{animation:spin 1s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.module-switch{display:flex;gap:2px;background:var(--fill);margin:12px 16px 0;padding:3px;border-radius:13px}
.mod-btn{flex:1;padding:9px 8px;border:none;background:none;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;border-radius:11px;text-align:center;letter-spacing:-0.01em;transition:all .2s;font-family:var(--font-display)}
.mod-btn.active{background:var(--card);color:var(--accent);box-shadow:0 1px 4px rgba(11,18,32,0.12),0 0 1px rgba(11,18,32,0.10)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(250,249,245,0.88);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:0.5px solid var(--hairline);display:flex;justify-content:center;align-items:center;gap:2px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:7px 14px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:500;min-width:58px;transition:color .15s}
.nav-btn.active{color:var(--accent);font-weight:600}
.nav-icon{font-size:23px;line-height:1}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;width:100%;background:var(--bg)}
.login-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;gap:18px;width:100%}
.login-body h2{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-0.03em}
.login-body p{font-size:16px;color:var(--muted);margin-top:-10px}
.login-form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.input-group{display:flex;flex-direction:column;gap:7px}
.input-label{font-size:13px;font-weight:600;color:var(--muted);padding-left:2px}
.input-field{width:100%;padding:15px 16px;border:0.5px solid var(--hairline);border-radius:var(--r-md);font-size:16px;font-family:inherit;color:var(--text);background:var(--card);transition:border-color .15s,box-shadow .15s}
.input-field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.input-field::placeholder{color:var(--muted);opacity:.7}
.btn-login{width:100%;padding:16px;background:var(--grad-blue);color:#fff;border:none;border-radius:var(--r-md);font-size:17px;font-weight:600;cursor:pointer;margin-top:8px;letter-spacing:-0.01em;transition:transform .1s,filter .15s;font-family:var(--font-display)}
.btn-login:active{filter:brightness(0.94);transform:scale(0.98)}
.btn-login:disabled{background:var(--muted);opacity:.5;cursor:not-allowed}
.login-error{background:var(--red-soft);color:var(--red);padding:12px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:500;text-align:center;display:none}
.page{padding:16px 16px 112px;width:100%}
.user-header{display:flex;align-items:center;gap:13px;margin-bottom:18px;background:var(--card);padding:14px 16px;border-radius:var(--r-lg);box-shadow:var(--shadow-sm);border:0.5px solid var(--hairline2);width:100%}
.user-av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;font-family:var(--font-display)}
.user-name{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-0.02em}
.user-sub{font-size:13px;color:var(--muted);margin-top:1px}
.signout{margin-left:auto;font-size:13px;color:var(--text2);background:var(--fill);border:none;border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s}
.signout:active{background:var(--gray-soft)}
.card{background:var(--card);border-radius:var(--r-lg);padding:18px;margin-bottom:12px;box-shadow:var(--shadow);border:0.5px solid var(--hairline2);width:100%}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-vendor{font-family:var(--font-display);font-size:18px;font-weight:600;flex:1;padding-right:10px;line-height:1.3;letter-spacing:-0.02em}
.card-amount{font-family:var(--font-display);font-size:19px;font-weight:700;white-space:nowrap;letter-spacing:-0.02em}
.card-meta{font-size:13px;color:var(--muted);margin-bottom:4px}
.card-prop{font-size:15px;color:var(--text2);margin-bottom:14px}
.card-note{font-size:14px;color:var(--text2);margin-bottom:12px;white-space:pre-line;word-break:break-word;background:var(--bg2);padding:10px 12px;border-radius:var(--r-sm);line-height:1.4}
.card-assign{font-size:13px;color:var(--accent);margin-bottom:10px;font-weight:600}
.btn-row{display:flex;flex-direction:column;gap:9px;width:100%}
.btn-approve{width:100%;padding:15px;background:var(--grad-green);color:#fff;border:none;border-radius:var(--r-md);font-size:16px;font-weight:600;cursor:pointer;letter-spacing:-0.01em;transition:transform .1s,filter .15s;font-family:var(--font-display)}
.btn-approve:active{filter:brightness(0.94);transform:scale(0.98)}
.btn-reject{width:100%;padding:15px;background:var(--card);color:var(--red);border:0.5px solid var(--hairline);border-radius:var(--r-md);font-size:16px;font-weight:600;cursor:pointer;transition:background .15s;font-family:var(--font-display)}
.btn-reject:active{background:var(--red-soft)}
.btn-pdf{width:100%;padding:13px;background:var(--fill);color:var(--text2);border:none;border-radius:var(--r-md);font-size:15px;font-weight:500;cursor:pointer;text-align:center;text-decoration:none;display:block;transition:background .15s}
.btn-pdf:active{background:var(--gray-soft)}
.btn-assign{width:100%;padding:13px;background:var(--accent-soft);color:var(--accent);border:none;border-radius:var(--r-md);font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.btn-action{width:100%;padding:13px;border:0.5px solid var(--hairline);border-radius:var(--r-md);font-size:15px;font-weight:500;cursor:pointer;text-align:center;background:var(--card);color:var(--text);transition:background .15s}
.btn-action:active{background:var(--fill)}
.btn-pay{width:100%;padding:15px;background:var(--grad-green);color:#fff;border:none;border-radius:var(--r-md);font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;transition:transform .1s,filter .15s;font-family:var(--font-display)}
.btn-pay:active{filter:brightness(0.94);transform:scale(0.98)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;gap:4px;letter-spacing:-0.01em}
.pill-green{background:var(--green-soft);color:var(--green)}
.pill-red{background:var(--red-soft);color:var(--red)}
.pill-blue{background:var(--accent-soft);color:var(--accent)}
.pill-yellow{background:var(--amber-soft);color:var(--amber)}
.pill-orange{background:var(--orange-soft);color:var(--orange)}
.pill-gray{background:var(--gray-soft);color:var(--text2)}
.pri-emergency{color:var(--red);font-weight:600}
.pri-urgent{color:var(--orange);font-weight:600}
.pri-high{color:var(--amber);font-weight:600}
.pri-medium{color:var(--accent);font-weight:600}
.pri-low{color:var(--muted);font-weight:500}
.summary{background:var(--card);border-radius:var(--r-lg);padding:18px 8px;margin-bottom:16px;display:flex;flex-wrap:wrap;box-shadow:var(--shadow-sm);border:0.5px solid var(--hairline2)}
.summary-item{flex:1;text-align:center;min-width:30%;position:relative}
.summary-item+.summary-item::before{content:'';position:absolute;left:0;top:15%;height:70%;width:0.5px;background:var(--hairline)}
.summary-val{font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:-0.03em}
.summary-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.4px}
.filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;-ms-overflow-style:none;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{padding:8px 16px;background:var(--card);border:0.5px solid var(--hairline);border-radius:999px;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.approved-tag{font-size:14px;color:var(--muted);margin-top:8px}
.empty{text-align:center;padding:80px 20px}
.empty-icon{font-size:52px;margin-bottom:16px;opacity:.9}
.empty-title{font-family:var(--font-display);font-size:21px;font-weight:600;margin-bottom:8px;letter-spacing:-0.02em}
.empty-sub{font-size:16px;color:var(--muted)}
.loading{text-align:center;padding:80px 20px;font-size:16px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(11,18,32,0.4);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:flex;align-items:flex-end;z-index:50;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:26px 20px calc(36px + env(safe-area-inset-bottom));width:100%;max-height:88vh;overflow-y:auto;position:relative;animation:slideup .28s cubic-bezier(0.32,0.72,0,1)}
.sheet::before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:999px;background:var(--gray-soft)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-title{font-family:var(--font-display);font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-0.02em}
.sheet-sub{font-size:15px;color:var(--muted);margin-bottom:20px}
.sheet textarea,.sheet input,.sheet select{width:100%;border:0.5px solid var(--hairline);border-radius:var(--r-md);padding:15px;font-size:16px;font-family:inherit;resize:none;color:var(--text);margin-bottom:12px;background:var(--card);-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
.sheet textarea{height:100px}
.sheet textarea:focus,.sheet input:focus,.sheet select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.sheet-btns{display:flex;gap:10px;margin-top:4px}
.btn-confirm-approve{flex:1;padding:16px;background:var(--grad-green);color:#fff;border:none;border-radius:var(--r-md);font-size:16px;font-weight:600;cursor:pointer;transition:transform .1s,filter .15s;font-family:var(--font-display)}
.btn-confirm-approve:active{filter:brightness(0.94);transform:scale(0.98)}
.btn-confirm-reject{flex:1;padding:16px;background:var(--red-soft);color:var(--red);border:none;border-radius:var(--r-md);font-size:16px;font-weight:600;cursor:pointer;font-family:var(--font-display)}
.btn-cancel{padding:16px 20px;background:var(--fill);color:var(--text2);border:none;border-radius:var(--r-md);font-size:16px;font-weight:500;cursor:pointer;transition:background .15s}
.btn-cancel:active{background:var(--gray-soft)}
.settings-card{background:var(--card);border-radius:var(--r-lg);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:0.5px solid var(--hairline2)}
.settings-title{font-family:var(--font-display);font-size:16px;font-weight:600;margin-bottom:14px;letter-spacing:-0.01em}
.settings-row{display:flex;flex-direction:column;gap:10px}
.btn-save{width:100%;padding:15px;background:var(--grad-blue);color:#fff;border:none;border-radius:var(--r-md);font-size:16px;font-weight:600;cursor:pointer;margin-top:6px;transition:transform .1s,filter .15s;font-family:var(--font-display)}
.btn-save:active{filter:brightness(0.94);transform:scale(0.98)}
.pin-msg{padding:12px;border-radius:var(--r-sm);font-size:14px;font-weight:500;text-align:center;margin-top:10px;display:none}
.pin-ok{background:var(--green-soft);color:var(--green)}
.pin-err{background:var(--red-soft);color:var(--red)}
.user-pick{padding:13px 14px;border:0.5px solid var(--hairline);border-radius:var(--r-md);background:var(--card);cursor:pointer;font-size:15px;font-weight:500;text-align:left;width:100%;margin-bottom:8px;display:flex;align-items:center;gap:11px;transition:background .15s}
.user-pick:active{background:var(--fill)}
.user-pick .pick-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex-shrink:0;font-family:var(--font-display)}
.dash-card{background:var(--card);border-radius:var(--r-lg);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-sm);border:0.5px solid var(--hairline2)}
.dash-title{font-family:var(--font-display);font-size:15px;font-weight:600;margin-bottom:12px;color:var(--text);letter-spacing:-0.01em}
.dash-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--hairline2);font-size:14px}
.dash-row:last-child{border-bottom:none}
.dash-label{color:var(--text2);flex:1;word-break:break-word;padding-right:8px}
.dash-value{font-family:var(--font-display);font-weight:600;flex-shrink:0}
.search-box{width:100%;padding:13px 16px;border:0.5px solid var(--hairline);border-radius:var(--r-md);font-size:16px;font-family:inherit;color:var(--text);background:var(--card);margin-bottom:14px;transition:border-color .15s,box-shadow .15s}
.search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.btn-add-tenant{width:100%;padding:15px;background:var(--grad-blue);color:#fff;border:none;border-radius:var(--r-md);font-size:16px;font-weight:600;cursor:pointer;margin-bottom:16px;transition:transform .1s,filter .15s;font-family:var(--font-display)}
.btn-add-tenant:active{filter:brightness(0.94);transform:scale(0.98)}
.btn-edit-tenant{width:100%;padding:13px;background:var(--fill);color:var(--text2);border:none;border-radius:var(--r-md);font-size:15px;font-weight:500;cursor:pointer;text-align:center;margin-top:8px;transition:background .15s}
.btn-edit-tenant:active{background:var(--gray-soft)}
.btn-renew-tenant{width:100%;padding:13px;background:var(--accent-soft);color:var(--accent);border:none;border-radius:var(--r-md);font-size:15px;font-weight:600;cursor:pointer;text-align:center;margin-top:10px;transition:opacity .15s}
.btn-renew-tenant:active{opacity:.7}
.tenant-detail{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:0.5px solid var(--hairline2)}
.tenant-detail:last-of-type{border-bottom:none}
.tenant-detail .td-label{color:var(--muted)}
.tenant-detail .td-value{font-weight:600;text-align:right}
.tenant-detail a{color:var(--accent);text-decoration:none;font-weight:600}
.addr-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--card);border:0.5px solid var(--hairline);border-radius:var(--r-md);box-shadow:0 8px 28px rgba(11,18,32,0.16);max-height:296px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.addr-opt{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:0.5px solid var(--hairline2);padding:13px 16px;font-family:inherit;font-size:16px;color:var(--text);cursor:pointer}
.addr-opt:last-child{border-bottom:none}
.addr-opt:active{background:var(--accent-soft)}
</style>
</head>
<body>
<div id="login-view" class="login-wrap">
  <div class="header"><h1>🏢 SkyHi Management</h1></div>
  <div class="login-body">
    <img src="skyhi_logo.png" style="width:200px;height:auto" alt="Sky High Management">
    <h2>Sign In</h2>
    <p>Enter your email and PIN</p>
    <div class="login-form">
      <div class="input-group">
        <label class="input-label">Email / Username</label>
        <input class="input-field" id="login-email" type="text" placeholder="you@skyhimanagement.com" autocomplete="email" autocapitalize="none">
      </div>
      <div class="input-group">
        <label class="input-label">PIN</label>
        <input class="input-field" id="login-pin" type="password" inputmode="numeric" placeholder="8-digit PIN" maxlength="8" autocomplete="off">
      </div>
      <div class="login-error" id="login-error"></div>
      <button class="btn-login" id="btn-login" onclick="handleLogin()">Sign In</button>
    </div>
  </div>
</div>
<div id="main-view" style="display:none;width:100%">
  <div class="header">
    <h1 id="header-title">SkyHi Management</h1>
    <span class="badge" id="header-badge" style="display:none"></span>
    <button class="header-refresh" id="refresh-btn" onclick="doRefresh()">↻</button>
  </div>
  <div class="module-switch" id="module-switch" style="display:none"></div>
  <div class="page" id="main-content"></div>
  <div class="bottom-nav" id="bottom-nav"></div>
</div>
<div class="overlay" id="overlay" style="display:none" onclick="overlayClick(event)">
  <div class="sheet" id="action-sheet"></div>
</div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyLKqK16tC3ohPCV3dqHBz0ohJVnfDGqSqfLFLBHSA8gnTxIaiNEXRGAK_YkNd-nEqy/exec';
const API_TOKEN='SkyHi2026$ecure!';
const INVOICE_TABS={
  manager:[{id:'pending',icon:'📋',label:'Pending'},{id:'done',icon:'✅',label:'Reviewed'}],
  payment:[{id:'payment',icon:'💳',label:'To Pay'}],
  admin:[{id:'pending',icon:'📋',label:'Pending'},{id:'done',icon:'✅',label:'Reviewed'},{id:'payment',icon:'💳',label:'To Pay'},{id:'paid',icon:'💰',label:'Paid'},{id:'summary',icon:'📊',label:'Summary'}],
  viewer:[{id:'paid',icon:'💰',label:'Paid'},{id:'summary',icon:'📊',label:'Summary'}],
};
const MAINT_TABS={
  admin:[{id:'m_open',icon:'🔧',label:'Open'},{id:'m_all',icon:'📋',label:'All'},{id:'m_dash',icon:'📊',label:'Dashboard'}],
  dispatcher:[{id:'m_open',icon:'🔧',label:'Open'},{id:'m_all',icon:'📋',label:'All'},{id:'m_dash',icon:'📊',label:'Dashboard'}],
  fieldworker:[{id:'m_mine',icon:'🔧',label:'My Jobs'},{id:'m_all',icon:'📋',label:'All'}],
  viewer:[{id:'m_open',icon:'🔧',label:'Open'},{id:'m_dash',icon:'📊',label:'Dashboard'}],
  manager:[{id:'m_open',icon:'🔧',label:'Open'},{id:'m_dash',icon:'📊',label:'Dashboard'}],
  payment:[],

async function api(params){
  params.token=API_TOKEN;
  const url=SCRIPT_URL+'?'+new URLSearchParams(params);
  try{
    const res=await fetch(url,{redirect:'follow',mode:'cors'});
    const text=await res.text();
    try{return JSON.parse(text);}
    catch(e){const m=text.match(/\((.+)\)/s);if(m)return JSON.parse(m[1]);throw e;}
  }catch(err){console.error('API error:',err);throw err;}
}
// Used when the payload is too big for a URL — photos, mainly.
// text/plain avoids a CORS preflight, which Apps Script can't respond to.
async function apiPost(params){
  params.token=API_TOKEN;
  try{
    const res=await fetch(SCRIPT_URL,{
      method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(params)
    });
    const text=await res.text();
    try{return JSON.parse(text);}
    catch(e){const m=text.match(/\((.+)\)/s);if(m)return JSON.parse(m[1]);throw e;}
  }catch(err){console.error('API POST error:',err);throw err;}
}

async function handleLogin(){

  const pin=document.getElementById('login-pin').value.trim();
  const errEl=document.getElementById('login-error');
  const btn=document.getElementById('btn-login');
  if(!email||!pin){errEl.textContent='Please enter both email/username and PIN';errEl.style.display='block';return;}
  if(pin.length!==8){errEl.textContent='PIN must be 8 digits';errEl.style.display='block';return;}
  btn.disabled=true;btn.textContent='Signing in...';errEl.style.display='none';
  try{
    const result=await api({action:'login',email,pin});
    if(result.success){
      currentUser={...result.user,init:ini(result.user.name)};
      document.getElementById('login-view').style.display='none';
      document.getElementById('main-view').style.display='block';

    }else{errEl.textContent=result.error||'Invalid credentials';errEl.style.display='block';}
  }catch(e){errEl.textContent='Connection error. Please try again.';errEl.style.display='block';}
  btn.disabled=false;btn.textContent='Sign In';
}

function parseLeaseDate(s){
  if(!s)return null;
  s=String(s).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m)return new Date(+m[3],+m[1]-1,+m[2]);
  const d=new Date(s);return isNaN(d)?null:d;
}
function leaseDaysLeft(t){
  const d=parseLeaseDate(t['Lease End']);if(!d)return null;
  const now=new Date();now.setHours(0,0,0,0);
  return Math.round((d-now)/864e5);
}
function fmtLeaseDate(s){const d=parseLeaseDate(s);return d?(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear():'—';}
function toDateInputValue(s){
  const d=parseLeaseDate(s);if(!d)return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function tenantStatusPill(s){
  const l=(s||'current').toLowerCase();
  if(l==='current'||l==='renewal signed')return 'pill-green';
  if(l==='renewal sent')return 'pill-blue';
  if(l==='no response'||l==='moving out')return 'pill-orange';
  if(l==='notice given')return 'pill-yellow';
  if(l==='in court')return 'pill-red';
  if(l==='vacant'||l==='moved out')return 'pill-gray';
  return 'pill-blue';
}

function dateToInputVal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function openRenewSheet(id){
  const t=tenants.find(x=>String(x['ID'])===String(id));
  if(!t)return;
  pendingAction={type:'renew',id:id};
  const oldEnd=parseLeaseDate(t['Lease End']);
  let newStartVal='',newEndVal='';
  if(oldEnd){
    const ns=new Date(oldEnd);ns.setDate(ns.getDate()+1);        // new term starts day after old lease ends
    const ne=new Date(oldEnd);ne.setFullYear(ne.getFullYear()+1); // suggest a 12-month renewal
    newStartVal=dateToInputVal(ns);newEndVal=dateToInputVal(ne);
  }
  const curRent=(t['Monthly Rent']!==undefined&&t['Monthly Rent']!=='')?escAttr(t['Monthly Rent']):'';
  showSheet(`<div class="sheet-title">Renew lease</div>
    <div class="sheet-sub">${esc(t['Tenant Name']||'')} · ${esc(t['Property']||'')}${t['Unit']?' · '+esc(t['Unit']):''}</div>
    <label class="input-label" style="margin-bottom:6px">New Lease Start</label>
    <input id="rn-start" type="date" value="${newStartVal}">
    <label class="input-label" style="margin-bottom:6px">New Lease End *</label>
    <input id="rn-end" type="date" value="${newEndVal}">
    <label class="input-label" style="margin-bottom:6px">New Monthly Rent ($)</label>
    <input id="rn-rent" type="number" inputmode="decimal" placeholder="Leave blank to keep current" value="${curRent}">
    <div class="sheet-btns"><button class="btn-cancel" onclick="closeSheet()">Cancel</button><button class="btn-confirm-approve" onclick="confirmRenew()">✓ Save Renewal</button></div>`);
}
async function confirmRenew(){
  if(!pendingAction||pendingAction.type!=='renew')return;
  const newEnd=document.getElementById('rn-end').value;
  if(!newEnd){alert('Please enter the new lease end date');return;}
  const newStart=document.getElementById('rn-start').value;
  const newRent=document.getElementById('rn-rent').value.trim();
  const id=pendingAction.id;
  const t=tenants.find(x=>String(x['ID'])===String(id));
  const today=new Date();
  const todayStr=(today.getMonth()+1)+'/'+today.getDate()+'/'+today.getFullYear();
  const renewLine='Renewed '+todayStr+': new term '+(newStart?fmtLeaseDate(newStart):'?')+' → '+fmtLeaseDate(newEnd)+(newRent?' at $'+newRent:'');
  const existingNotes=(t&&t['Notes'])?String(t['Notes']):'';
  const newNotes=existingNotes?existingNotes+'\n'+renewLine:renewLine;
  const params={action:'updateTenant',id:id,leaseEnd:newEnd,status:'Renewal Signed',notes:newNotes};
  if(newStart)params.leaseStart=newStart;
  if(newRent)params.monthlyRent=newRent;
  closeSheet();
  document.getElementById('main-content').innerHTML='<div class="loading">Saving renewal…</div>';
  try{
    const r=await api(params);
    if(r&&r.success===false){alert(r.error||'Error saving.');}
    await loadTenants();
  }catch(e){alert('Error saving.');render();}
}

let garbageFlash='';
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// Business days only — the crew works Mon–Fri, so a Friday report is still
// "1 day" on Monday, not 3. Counts weekdays AFTER the report date.
// (Public holidays are not accounted for.)
function daysSince(s){
  const d=parseLeaseDate(s);if(!d)return null;
  const now=new Date();now.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  if(d>=now)return 0;
  let n=0;const cur=new Date(d);
  while(cur<now){
    cur.setDate(cur.getDate()+1);
    const dow=cur.getDay();
    if(dow!==0&&dow!==6)n++;
  }
  return n;
}
function waitLabel(days,dateStr){
  if(days===null)return '';
  // 0 business days can mean "reported today" OR "reported Friday, it's Sunday".
  if(days<=0)return (dateStr&&String(dateStr).slice(0,10)!==todayStr())
    ? 'Waiting since '+fmtLeaseDate(dateStr) : 'Reported today';
  if(days===1)return 'Waiting 1 business day';
  return 'Waiting '+days+' business days';
}
function canPickup(){return currentUser&&['hauler','admin','dispatcher'].indexOf(currentUser.role)>=0;}
function canReportGarbage(){return currentUser&&['fieldworker','garbagecrew','admin','dispatcher','manager'].indexOf(currentUser.role)>=0;}
function canCancelGarbage(){return currentUser&&currentUser.role==='admin';}
// Group every still-open report by address, so three days of duplicates
// show as ONE card with a count — not three separate jobs.
function garbageOpenGroups(){
  const open=garbage.filter(g=>String(g['Status']||'')==='Open');
  const map={};
  open.forEach(g=>{
    const a=String(g['Address']||'').trim();
    if(!a)return;
    const k=a.toLowerCase();
    if(!map[k])map[k]={address:a,city:String(g['City']||''),reports:[]};
    map[k].reports.push(g);
  });
  return Object.keys(map).map(k=>{
    const grp=map[k];
    grp.reports.sort((a,b)=>String(a['Date Reported']).localeCompare(String(b['Date Reported'])));
    grp.oldest=grp.reports[0]['Date Reported'];
    grp.days=daysSince(grp.oldest);
    return grp;
  }).sort((a,b)=>(b.days||0)-(a.days||0));
}
function openCountFor(address){
  const t=String(address||'').trim().toLowerCase();
  return garbage.filter(g=>String(g['Status']||'')==='Open'&&String(g['Address']||'').trim().toLowerCase()===t).length;
}

// Type-ahead: one box. Start typing, matching addresses drop down underneath,

function matchingProps(){
  const q=garbageAddrSearch.trim().toLowerCase();
  if(!q)return properties.slice(0,60);
  const words=q.split(/\s+/).filter(Boolean);
  const scored=[];
  properties.forEach((p,i)=>{
    const hay=(String(p['Address']||'')+' '+String(p['City']||'')).toLowerCase();
    if(!words.every(w=>hay.includes(w)))return;
    // A match at the very start ranks above a match in the middle.
    scored.push({i:i,rank:hay.indexOf(words[0])===0?0:1});
  });
  scored.sort((a,b)=>a.rank-b.rank||a.i-b.i);
  return scored.slice(0,60).map(s=>properties[s.i]);
}

// ─── PHOTOS ───
// Phone cameras produce 3–5MB files. We shrink to ~1200px / 65% JPEG before
// sending, so a report uploads in seconds even on a weak signal.
const MAX_PHOTOS=3;
let garbagePhotos=[]; // array of data: URLs, already shrunk
function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Could not read that file'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('That file is not an image'));
      img.onload=()=>{
        const MAX=1200;
        let w=img.width,h=img.height;
        if(w>h&&w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        else if(h>=w&&h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        resolve(cv.toDataURL('image/jpeg',0.65));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function onPhotoPick(input){
  const files=Array.from(input.files||[]);
  input.value='';
  if(!files.length)return;
  const room=MAX_PHOTOS-garbagePhotos.length;

  const status=document.getElementById('g-photo-status');
  if(status){status.style.display='block';status.textContent='Shrinking photo…';}
  for(const f of files.slice(0,room)){
    try{garbagePhotos.push(await shrinkImage(f));}

  if(status)status.style.display='none';
  renderPhotoStrip();
}

  const address=garbageAddrPick.address;
  const city=garbageAddrPick.city;
  const loc=document.getElementById('g-loc').value;
  const date=document.getElementById('g-date').value||todayStr();
  const note=document.getElementById('g-note').value.trim();
  if(!loc){alert('Please pick where at the building the garbage is');return;}
  const btn=document.getElementById('g-submit');
  btn.disabled=true;btn.textContent=garbagePhotos.length?'Uploading photo…':'Saving…';
  try{
    // No photos? Use the plain GET call that every other screen uses.
    // Only a report carrying photos needs the POST path.
    const payload={action:'addGarbage',address,city,location:loc,note,dateReported:date,reportedBy:currentUser.name};
    const r=garbagePhotos.length
      ? await apiPost(Object.assign({},payload,{photos:garbagePhotos}))
      : await api(payload);
    if(r&&r.success===false){alert(r.error||'Error saving.');btn.disabled=false;btn.textContent='✓ Submit Report';return;}
    if(r&&r.warning)alert(r.warning);
    garbageFlash='Reported: '+address+(city?' ('+city+')':'');
    garbageAddrSearch='';garbageAddrPick=null;garbagePhotos=[];
    await loadGarbage();
  }catch(e){alert('Error saving. Check your signal and try again.');btn.disabled=false;btn.textContent='✓ Submit Report';}
}
// ─── OUTSTANDING (one card per address) ───
function garbageGroupCard(g){
  const n=g.reports.length;
  const dayPill=g.days===null?'':(g.days>=5?'pill-red':g.days>=3?'pill-orange':'pill-blue');
  let lines='';
  g.reports.forEach(r=>{
    lines+=`<div class="tenant-detail" style="align-items:flex-start">
      <span class="td-label" style="white-space:nowrap">${esc(fmtLeaseDate(r['Date Reported']))}</span>
      <span class="td-value" style="text-align:right;font-weight:500">${esc(r['Location']||'—')}${r['Note']?'<br><span style="color:var(--muted);font-weight:400">'+esc(r['Note'])+'</span>':''}<br><span style="color:var(--muted);font-weight:400;font-size:12px">by ${esc(r['Reported By']||'—')}</span></span>
    </div>${photoStripHTML(r['Photos'])}`;
  });
  return `<div class="card">
    <div class="card-row"><div class="card-vendor">${esc(g.address)}</div>${n>1?`<span class="pill pill-red">${n} reports</span>`:''}</div>
    <div class="card-prop">📍 ${esc(g.city||'—')}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      ${dayPill?`<span class="pill ${dayPill}">${esc(waitLabel(g.days,g.oldest))}</span>`:''}
      <span class="pill pill-gray">First reported ${esc(fmtLeaseDate(g.oldest))}</span>
    </div>
    ${lines}
    ${canPickup()?`<button class="btn-approve" style="margin-top:12px" data-addr="${escAttr(g.address)}" onclick="openPickupSheet(this.dataset.addr)">✓ Mark Picked Up${n>1?' (closes all '+n+')':''}</button>`:''}
    ${canCancelGarbage()&&n===1?`<button class="btn-edit-tenant" data-id="${escAttr(String(g.reports[0]['ID']))}" onclick="cancelGarbageReport(this.dataset.id)">✕ Cancel this report</button>`:''}
  </div>`;
}
function renderGarbageOpen(c){
  const groups=garbageOpenGroups();
  const totalReports=groups.reduce((s,g)=>s+g.reports.length,0);
  const stale=groups.filter(g=>(g.days||0)>=3).length;
  let html=userHeader(`${groups.length} address${groups.length===1?'':'es'} waiting · ${totalReports} report${totalReports===1?'':'s'}`);
  if(!groups.length){
    html+=`<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">Nothing outstanding</div><div class="empty-sub">Every reported pile has been picked up.</div></div>`;
    c.innerHTML=html;return;
  }
  html+=`<div class="summary">
    <div class="summary-item"><div class="summary-val">${groups.length}</div><div class="summary-lbl">Addresses</div></div>
    <div class="summary-item"><div class="summary-val">${totalReports}</div><div class="summary-lbl">Reports</div></div>
    <div class="summary-item"><div class="summary-val" style="color:#ea580c">${stale}</div><div class="summary-lbl">3+ work days</div></div>
  </div>`;
  html+=filterChips(groups.map(g=>({City:g.city})),'City');
  const filtered=activeFilter==='All'?groups:groups.filter(g=>(g.city||'Other')===activeFilter);
  filtered.forEach(g=>{html+=garbageGroupCard(g);});
  c.innerHTML=html;
}
function openPickupSheet(address){
  const n=openCountFor(address);
  pendingAction={type:'pickup',address};
  showSheet(`<div class="sheet-title">Mark picked up</div>
    <div class="sheet-sub">${esc(address)}</div>
    ${n>1?`<div style="background:var(--green-soft);color:var(--green);padding:12px 14px;border-radius:var(--r-sm);font-size:14px;line-height:1.4;margin-bottom:14px">This address has <b>${n}</b> open reports stacked up. Saving closes <b>all ${n}</b> at once.</div>`:''}
    <label class="input-label" style="margin-bottom:6px">Date picked up</label>
    <input id="pk-date" type="date" value="${todayStr()}">
    <div class="sheet-btns"><button class="btn-cancel" onclick="closeSheet()">Cancel</button><button class="btn-confirm-approve" onclick="confirmPickup()">✓ Mark Picked Up</button></div>`);
}
async function confirmPickup(){
  if(!pendingAction||pendingAction.type!=='pickup')return;
  const pickupDate=document.getElementById('pk-date').value||todayStr();
  const address=pendingAction.address;
  closeSheet();
  document.getElementById('main-content').innerHTML='<div class="loading">Saving…</div>';
  try{
    const r=await api({action:'pickupGarbage',address,pickupDate,userName:currentUser.name});
    if(r&&r.success===false){alert(r.error||'Error saving.');}
    await loadGarbage();
  }catch(e){alert('Error saving.');render();}
}
async function cancelGarbageReport(id){
  if(!confirm('Cancel this report? It stays in the history but stops showing as outstanding.'))return;
  document.getElementById('main-content').innerHTML='<div class="loading">Saving…</div>';
  try{await api({action:'cancelGarbage',id,userName:currentUser.name});await loadGarbage();}
  catch(e){alert('Error saving.');render();}
}
// ─── DONE / HISTORY ───
function garbageHistoryCard(r){
  const st=String(r['Status']||'');
  const pill=st==='Picked Up'?'pill-green':st==='Cancelled'?'pill-gray':'pill-orange';
  return `<div class="card">
    <div class="card-row"><div class="card-vendor">${esc(r['Address']||'—')}</div><span class="pill ${pill}">${esc(st||'Open')}</span></div>
    <div class="card-prop">📍 ${esc(r['City']||'—')}${r['Location']?' · '+esc(r['Location']):''}</div>
    ${r['Note']?`<div class="card-note">${esc(r['Note'])}</div>`:''}
    ${photoStripHTML(r['Photos'])}
    <div class="tenant-detail"><span class="td-label">Reported</span><span class="td-value">${esc(fmtLeaseDate(r['Date Reported']))} by ${esc(r['Reported By']||'—')}</span></div>
    ${r['Pickup Date']?`<div class="tenant-detail"><span class="td-label">Picked up</span><span class="td-value">${esc(fmtLeaseDate(r['Pickup Date']))}${r['Picked Up By']?' by '+esc(r['Picked Up By']):''}</span></div>`:''}
  </div>`;
}
function renderGarbageDone(c){
  const done=garbage.filter(g=>String(g['Status']||'')==='Picked Up')
    .sort((a,b)=>String(b['Pickup Date']).localeCompare(String(a['Pickup Date'])));
  let html=userHeader(`${done.length} picked up`);
  if(!done.length){html+=`<div class="empty"><div class="empty-icon">🗑</div><div class="empty-title">Nothing picked up yet</div></div>`;c.innerHTML=html;return;}
  done.slice(0,100).forEach(r=>{html+=garbageHistoryCard(r);});
  if(done.length>100)html+=`<div class="card-meta" style="text-align:center">Showing the 100 most recent of ${done.length}.</div>`;
  c.innerHTML=html;
}
function renderGarbageAll(c){
  const all=garbage.slice().sort((a,b)=>String(b['Date Reported']).localeCompare(String(a['Date Reported'])));
  const filtered=activeFilter==='All'?all:all.filter(g=>(g['Status']||'Open')===activeFilter);
  let html=userHeader(`${all.length} total reports`);
  html+=filterChips(all,'Status');
  if(!filtered.length){html+=`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">No reports</div></div>`;c.innerHTML=html;return;}
  filtered.slice(0,150).forEach(r=>{html+=garbageHistoryCard(r);});
  if(filtered.length>150)html+=`<div class="card-meta" style="text-align:center">Showing the 150 most recent of ${filtered.length}.</div>`;
  c.innerHTML=html;
}
// ═══ USER MANAGEMENT (admin only) ═══
const ROLE_INFO={
  admin:{label:'Admin',desc:'Everything — invoices, maintenance, tenants, garbage, and this screen'},
  manager:{label:'Manager',desc:'Approve invoices, maintenance, tenants, garbage'},
  payment:{label:'Payment',desc:'The To Pay queue only'},
  viewer:{label:'Viewer',desc:'Read-only invoices, maintenance and tenants'},
  dispatcher:{label:'Dispatcher',desc:'Maintenance + garbage — can assign and close'},
  fieldworker:{label:'Field worker',desc:'Their own maintenance jobs + reporting bulk garbage'},
  hauler:{label:'Hauler',desc:'Bulk garbage pickup only — nothing else'},
  garbagecrew:{label:'Garbage crew',desc:'Reporting bulk garbage only — no maintenance tickets'},
};
const ROLE_ORDER=['admin','manager','dispatcher','fieldworker','garbagecrew','hauler','payment','viewer'];
function isAdmin(){return currentUser&&currentUser.role==='admin';}
function roleAvColor(role){
  const colors={admin:'background:#fef9c3;color:#ca8a04',manager:'background:#dbeafe;color:#1d4ed8',payment:'background:#dcfce7;color:#16a34a',viewer:'background:#e8e8e8;color:#666',dispatcher:'background:#fce8ff;color:#a855f7',fieldworker:'background:#fff7ed;color:#ea580c',hauler:'background:#e6f6ec;color:#16a34a',garbagecrew:'background:#e7edfd;color:#1d4ed8'};
  return colors[role]||'background:#e8e8e8;color:#666';
}
function randomPin(){let s='';for(let i=0;i<8;i++)s+=Math.floor(Math.random()*10);return s;}
async function renderUsersAdmin(c){
  if(!isAdmin()){c.innerHTML=userHeader('Users')+'<div class="empty"><div class="empty-icon">🔒</div><div class="empty-title">Admins only</div></div>';return;}
  c.innerHTML='<div class="loading">Loading users…</div>';
  await loadUsers();
  const active=allUsers.filter(u=>String(u.status||'Active').toLowerCase()!=='inactive');
  const inactive=allUsers.filter(u=>String(u.status||'Active').toLowerCase()==='inactive');
  let html=userHeader(`${active.length} active · ${inactive.length} deactivated`);
  html+=`<button class="btn-action" style="margin-bottom:14px" onclick="switchTab('settings')">← Back to Settings</button>`;
  html+=`<button class="btn-add-tenant" onclick="openUserSheet()">＋ Add User</button>`;
  const card=u=>{
    const role=String(u.role||'').trim().toLowerCase();
    const info=ROLE_INFO[role];
    const off=String(u.status||'Active').toLowerCase()==='inactive';
    const me=String(u.email||'').toLowerCase()===String(currentUser.email||'').toLowerCase();
    return `<div class="card"${off?' style="opacity:.62"':''}>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <div class="user-av" style="${roleAvColor(role)};width:40px;height:40px;font-size:14px">${ini(String(u.name||'?'))}</div>
        <div style="flex:1;min-width:0">
          <div class="user-name">${esc(u.name||'—')}${me?' <span style="font-size:12px;color:var(--muted);font-weight:500">(you)</span>':''}</div>
          <div class="user-sub" style="word-break:break-all">${esc(u.email||'')}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
        <span class="pill ${off?'pill-gray':'pill-blue'}">${esc(info?info.label:u.role||'—')}</span>
        ${off?'<span class="pill pill-gray">Deactivated</span>':''}
        ${!info?'<span class="pill pill-red">Unknown role — they will see nothing</span>':''}
      </div>
      ${info?`<div class="card-note" style="margin-bottom:12px">${esc(info.desc)}</div>`:''}
      <div class="btn-row">
        <button class="btn-action" data-e="${escAttr(u.email)}" onclick="openUserSheet(this.dataset.e)">✏️ Edit name / role</button>
        <button class="btn-action" data-e="${escAttr(u.email)}" onclick="openPinSheet(this.dataset.e)">🔑 Set new PIN</button>
        ${off
          ? `<button class="btn-action" data-e="${escAttr(u.email)}" onclick="setUserActive(this.dataset.e,'Active')">↩️ Reactivate</button>`
          : `<button class="btn-reject" data-e="${escAttr(u.email)}" onclick="setUserActive(this.dataset.e,'Inactive')">🚫 Deactivate</button>`}
      </div>
    </div>`;
  };
  if(!allUsers.length)html+=`<div class="empty"><div class="empty-icon">👥</div><div class="empty-title">No users found</div><div class="empty-sub">Check the Users tab in the sheet.</div></div>`;
  active.forEach(u=>{html+=card(u);});
  if(inactive.length){
    html+=`<div class="dash-title" style="margin:20px 0 10px">Deactivated</div>`;
    inactive.forEach(u=>{html+=card(u);});
  }
  c.innerHTML=html;
}
function openUserSheet(email){
  const u=email?allUsers.find(x=>String(x.email).toLowerCase()===String(email).toLowerCase()):null;
  pendingAction={type:'user',originalEmail:u?u.email:null};
  const curRole=u?String(u.role||'').trim().toLowerCase():'';
  const roleOpts=ROLE_ORDER.map(r=>`<option value="${r}"${r===curRole?' selected':''}>${esc(ROLE_INFO[r].label)} — ${esc(ROLE_INFO[r].desc)}</option>`).join('');
  showSheet(`<div class="sheet-title">${u?'Edit user':'Add user'}</div>
    <div class="sheet-sub">${u?esc(u.name||''):'New login for someone on your team'}</div>
    <label class="input-label" style="margin-bottom:6px">Full name *</label>
    <input id="us-name" placeholder="e.g. Rosa Delgado" value="${u?escAttr(u.name):''}">
    <label class="input-label" style="margin-bottom:6px">Email / username *</label>
    <input id="us-email" type="email" autocapitalize="none" placeholder="name@skyhimanagement.com" value="${u?escAttr(u.email):''}">
    <label class="input-label" style="margin-bottom:6px">Role *</label>
    <select id="us-role">${u?'':'<option value="">Select a role…</option>'}${roleOpts}</select>
    ${u?'':`<label class="input-label" style="margin-bottom:6px">8-digit PIN *</label>
    <input id="us-pin" inputmode="numeric" maxlength="8" placeholder="8 digits" value="${randomPin()}">
    <div style="font-size:13px;color:var(--muted);margin:-4px 0 14px">I filled in a random PIN. Write it down and give it to them — they can change it later in Settings.</div>`}
    <div class="sheet-btns"><button class="btn-cancel" onclick="closeSheet()">Cancel</button><button class="btn-confirm-approve" onclick="confirmUserSave()">✓ Save</button></div>`);
}
async function confirmUserSave(){
  if(!pendingAction||pendingAction.type!=='user')return;
  const name=document.getElementById('us-name').value.trim();
  const email=document.getElementById('us-email').value.trim();
  const role=document.getElementById('us-role').value;
  const isNew=!pendingAction.originalEmail;
  const pinEl=document.getElementById('us-pin');
  const pin=pinEl?pinEl.value.trim():'';
  if(!name){alert('Please enter a name');return;}
  if(!email){alert('Please enter an email');return;}
  if(!role){alert('Please pick a role');return;}
  if(isNew&&!/^\d{8}$/.test(pin)){alert('PIN must be exactly 8 digits');return;}
  const originalEmail=pendingAction.originalEmail;
  closeSheet();
  document.getElementById('main-content').innerHTML='<div class="loading">Saving…</div>';
  try{
    const p=isNew
      ?{action:'addUser',name,email,role,pin,actorEmail:currentUser.email}
      :{action:'updateUser',name,email,role,originalEmail,actorEmail:currentUser.email};
    const r=await api(p);
    if(r&&r.success===false){alert(r.error||'Error saving.');}
    else if(isNew)alert('User added.\n\n'+name+'\n'+email+'\nPIN: '+pin+'\n\nWrite this down — the PIN is not shown again.');
    renderUsersAdmin(document.getElementById('main-content'));
  }catch(e){alert('Error saving.');renderUsersAdmin(document.getElementById('main-content'));}
}
function openPinSheet(email){
  const u=allUsers.find(x=>String(x.email).toLowerCase()===String(email).toLowerCase());
  pendingAction={type:'userpin',email};
  showSheet(`<div class="sheet-title">Set a new PIN</div>
    <div class="sheet-sub">${esc(u?u.name:email)}</div>
    <label class="input-label" style="margin-bottom:6px">New 8-digit PIN</label>
    <input id="us-newpin" inputmode="numeric" maxlength="8" value="${randomPin()}">
    <div style="font-size:13px;color:var(--muted);margin:-4px 0 14px">This replaces their old PIN straight away. Give them the new one.</div>
    <div class="sheet-btns"><button class="btn-cancel" onclick="closeSheet()">Cancel</button><button class="btn-confirm-approve" onclick="confirmPinSet()">✓ Set PIN</button></div>`);
}
async function confirmPinSet(){
  if(!pendingAction||pendingAction.type!=='userpin')return;
  const pin=document.getElementById('us-newpin').value.trim();
  if(!/^\d{8}$/.test(pin)){alert('PIN must be exactly 8 digits');return;}
  const email=pendingAction.email;
  closeSheet();
  document.getElementById('main-content').innerHTML='<div class="loading">Saving…</div>';
  try{
    const r=await api({action:'setUserPin',email,pin,actorEmail:currentUser.email});
    if(r&&r.success===false)alert(r.error||'Error saving.');
    else alert('New PIN for '+email+':\n\n'+pin+'\n\nWrite this down — it is not shown again.');
  }catch(e){alert('Error saving.');}
  renderUsersAdmin(document.getElementById('main-content'));
}
async function setUserActive(email,status){
  const verb=status==='Inactive'?'Deactivate':'Reactivate';
  const extra=status==='Inactive'?'\n\nThey will not be able to sign in. Their history stays in the sheet.':'';
  if(!confirm(verb+' '+email+'?'+extra))return;
  document.getElementById('main-content').innerHTML='<div class="loading">Saving…</div>';
  try{
    const r=await api({action:'setUserStatus',email,status,actorEmail:currentUser.email});
    if(r&&r.success===false)alert(r.error||'Error saving.');
  }catch(e){alert('Error saving.');}
  renderUsersAdmin(document.getElementById('main-content'));
}
// ─── SETTINGS ───
function renderSettings(c){
  let html=userHeader('Settings');
  if(isAdmin()){
    html+=`<div class="settings-card"><div class="settings-title">👥 Team & Access</div>
      <div style="font-size:14px;color:var(--text2);margin-bottom:12px;line-height:1.4">Add someone new, change what they can see, reset a PIN, or shut off access for someone who has left.</div>
      <button class="btn-save" style="margin-top:0" onclick="switchTab('users')">Manage Users</button></div>`;
  }
  html+=`<div class="settings-card"><div class="settings-title">🔑 Change PIN</div><div class="settings-row">
    <div class="input-group"><label class="input-label">Current PIN</label><input class="input-field" id="old-pin" type="password" inputmode="numeric" maxlength="8" placeholder="Enter current PIN"></div>
    <div class="input-group"><label class="input-label">New PIN (8 digits)</label><input class="input-field" id="new-pin" type="password" inputmode="numeric" maxlength="8" placeholder="Enter new PIN"></div>
    <div class="input-group"><label class="input-label">Confirm New PIN</label><input class="input-field" id="confirm-pin" type="password" inputmode="numeric" maxlength="8" placeholder="Confirm new PIN"></div>
    <button class="btn-save" onclick="handleChangePin()">Save New PIN</button>
    <div class="pin-msg" id="pin-msg"></div></div></div>`;
  html+=`<div class="settings-card"><div class="settings-title">👤 Account Info</div><div style="font-size:15px;color:#666">
    <div style="margin-bottom:8px"><strong>Name:</strong> ${esc(currentUser.name)}</div>
    <div style="margin-bottom:8px"><strong>Email:</strong> ${esc(currentUser.email)}</div>
    <div><strong>Role:</strong> ${esc(currentUser.role)}</div></div></div>`;
  html+=`<div class="settings-card"><div class="settings-title">ℹ️ About</div><div style="font-size:14px;color:#888">SkyHi Management v7.0 · Invoices · Maintenance · Tenants · Bulk Garbage</div></div>`;
  c.innerHTML=html;
}
async function handleChangePin(){
  const oldPin=document.getElementById('old-pin').value.trim();
  const newPin=document.getElementById('new-pin').value.trim();
  const confirmPin=document.getElementById('confirm-pin').value.trim();
  if(!oldPin||!newPin||!confirmPin){showPinMsg('Please fill in all fields','err');return;}
  if(newPin.length!==8||!/^\d+$/.test(newPin)){showPinMsg('New PIN must be exactly 8 digits','err');return;}
  if(newPin!==confirmPin){showPinMsg('New PINs do not match','err');return;}
  try{const r=await api({action:'changePin',email:currentUser.email,oldPin,newPin});
    if(r.success){showPinMsg('PIN changed successfully! ✓','ok');document.getElementById('old-pin').value='';document.getElementById('new-pin').value='';document.getElementById('confirm-pin').value='';}
    else showPinMsg(r.error||'Failed','err');
  }catch(e){showPinMsg('Connection error.','err');}
}
function showPinMsg(text,type){
  const el=document.getElementById('pin-msg');el.textContent=text;
  el.className='pin-msg '+(type==='ok'?'pin-ok':'pin-err');el.style.display='block';
  setTimeout(()=>{el.style.display='none';},4000);
}
async function renderSummary(c){
  c.innerHTML='<div class="loading">Loading summary…</div>';
  try{
    const data=await api({action:'getMonthlySummary'});
    let html=userHeader('Monthly Summary');
    const months=Object.keys(data).sort().reverse();
    if(!months.length){html+='<div class="empty"><div class="empty-icon">📊</div><div class="empty-title">No data yet</div></div>';}
    months.forEach(month=>{
      const d=data[month];
      const [year,mon]=month.split('-');
      const label=new Date(year,mon-1).toLocaleString('default',{month:'long',year:'numeric'});
      html+=`<div class="dash-card">
        <div class="dash-title">📅 ${label}</div>
        <div class="dash-row"><div class="dash-label">Total Invoices</div><div class="dash-value">${d.count}</div></div>
        <div class="dash-row"><div class="dash-label">Total Amount</div><div class="dash-value" style="color:#1D9E75">${fmt(d.total)}</div></div>
        <div style="margin-top:12px;font-weight:700;font-size:13px;color:#555;margin-bottom:6px">BY PROPERTY</div>
        ${Object.entries(d.byProperty).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="dash-row"><div class="dash-label">${esc(k)}</div><div class="dash-value">${fmt(v)}</div></div>`).join('')}
        <div style="margin-top:12px;font-weight:700;font-size:13px;color:#555;margin-bottom:6px">BY VENDOR</div>
        ${Object.entries(d.byVendor).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div class="dash-row"><div class="dash-label">${esc(k)}</div><div class="dash-value">${fmt(v)}</div></div>`).join('')}
        <div style="margin-top:12px;font-weight:700;font-size:13px;color:#555;margin-bottom:6px">BY EXPENSE TYPE</div>
        ${Object.entries(d.byExpenseType).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="dash-row"><div class="dash-label">${esc(k)}</div><div class="dash-value">${fmt(v)}</div></div>`).join('')}
      </div>`;
    });
    c.innerHTML=html;
  }catch(e){c.innerHTML='<div class="loading">Error loading summary.</div>';}
}
// INIT
document.getElementById('main-view').style.display='none';
document.getElementById('login-view').style.display='flex';
